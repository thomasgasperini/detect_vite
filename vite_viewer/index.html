<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Vite viewer</title>
<style>
  :root {
    --bg: #ffffff; --fg: #262730; --sec: #f0f2f6; --primary: #ff4b4b;
    --border: rgba(128,128,128,.38);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--fg);
    font-family: "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
  }
  #app { display: flex; flex-direction: column; height: 100%; gap: 8px; }

  /* barra strumenti */
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
  .grp { display: flex; align-items: center; gap: 8px; }
  .grp[hidden] { display: none; }
  .spacer { flex: 1; }
  .lbl { font-size: 11px; font-weight: 650; letter-spacing: .07em;
         text-transform: uppercase; opacity: .6; }
  .seg { display: inline-flex; border: 1px solid var(--border);
         border-radius: 6px; overflow: hidden; }
  button {
    font: inherit; font-weight: 550; color: var(--fg); background: var(--sec);
    border: 0; padding: 6px 12px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  button:hover { filter: brightness(.94); }
  button.on { background: var(--primary); color: #fff; }
  button.solo { border: 1px solid var(--border); border-radius: 6px; }
  #zlbl { min-width: 44px; opacity: .7; font-variant-numeric: tabular-nums; }

  /* pannelli immagine */
  #panes { flex: 1; display: flex; gap: 8px; min-height: 0; }
  .pane {
    position: relative; flex: 1; min-width: 0; overflow: hidden;
    background: #151515; border: 1px solid var(--border); border-radius: 6px;
    touch-action: none;
  }
  .pane.hide { display: none; }
  .pane.pan { cursor: grab; }
  .pane.pan.drag { cursor: grabbing; }
  .pane.remove { cursor: pointer; }
  .pane.poly { cursor: crosshair; }
  .tag {
    position: absolute; top: 8px; left: 8px; z-index: 2; pointer-events: none;
    background: rgba(0,0,0,.6); color: #fff; font-size: 11px; font-weight: 650;
    letter-spacing: .06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 4px;
  }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0;
           will-change: transform; }
  .stage img { display: block; user-select: none; -webkit-user-drag: none; }
  .stage svg { position: absolute; left: 0; top: 0; overflow: visible;
               pointer-events: none; }

  /* suggerimento */
  #hint { min-height: 20px; font-size: 13px; opacity: .8; }
  #hint b { font-weight: 650; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="grp">
      <span class="lbl">Strumento</span>
      <div class="seg" id="modes">
        <button data-mode="pan" class="on">Naviga</button>
        <button data-mode="remove">Rimuovi chiazza</button>
        <button data-mode="poly">Aggiungi zona</button>
      </div>
    </div>
    <div class="grp" id="drawgrp" hidden>
      <button class="solo" id="bClose">Chiudi zona</button>
      <button class="solo" id="bUndoPt">Annulla vertice</button>
      <button class="solo" id="bCancel">Annulla disegno</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <span class="lbl">Vista</span>
      <div class="seg" id="views">
        <button data-view="both" class="on">Affiancate</button>
        <button data-view="orig">Originale</button>
        <button data-view="ov">Rilevamento</button>
      </div>
    </div>
    <div class="grp">
      <span class="lbl">Zoom</span>
      <div class="seg">
        <button id="zout" title="Riduci">&minus;</button>
        <button id="zfit">Adatta</button>
        <button id="zin" title="Ingrandisci">+</button>
      </div>
      <span id="zlbl"></span>
    </div>
  </div>

  <div id="panes">
    <div class="pane pan" id="paneA">
      <div class="tag">Originale</div>
      <div class="stage"><img draggable="false"><svg></svg></div>
    </div>
    <div class="pane pan" id="paneB">
      <div class="tag">Rilevamento</div>
      <div class="stage"><img draggable="false"><svg></svg></div>
    </div>
  </div>

  <div id="hint"></div>
</div>

<script>
/* ---------- protocollo componente Streamlit (senza dipendenze) ---------- */
function post(type, data) {
  window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
}
const ST = {
  ready:  () => post("streamlit:componentReady", {apiVersion: 1}),
  height: h  => post("streamlit:setFrameHeight", {height: h}),
  value:  v  => post("streamlit:setComponentValue", {value: v, dataType: "json"}),
};

/* ----------------------------- stato ----------------------------- */
const S = {
  W: 0, H: 0, s: 1, tx: 0, ty: 0, fitS: 1, fitted: true,
  mode: "pan", view: "both",
  pts: [], cursor: null, flash: null,
  origId: null, ovId: null, height: 0,
};
const $ = id => document.getElementById(id);
const panes = [$("paneA"), $("paneB")];
const stages = panes.map(p => p.querySelector(".stage"));
const imgs   = panes.map(p => p.querySelector("img"));
const svgs   = panes.map(p => p.querySelector("svg"));

/* ------------------------- render da Streamlit ------------------------- */
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "streamlit:render") return;
  const a = e.data.args || {};
  const t = e.data.theme;
  if (t) {
    const r = document.documentElement.style;
    r.setProperty("--bg", t.backgroundColor);
    r.setProperty("--fg", t.textColor);
    r.setProperty("--sec", t.secondaryBackgroundColor);
    r.setProperty("--primary", t.primaryColor);
  }
  const h = a.height || 720;
  if (h !== S.height) { S.height = h; ST.height(h); }
  loadImage(0, a.original, a.original_id, "origId");
  loadImage(1, a.overlay,  a.overlay_id,  "ovId");
});

function loadImage(i, url, id, flag) {
  if (!url || S[flag] === id) return;
  S[flag] = id;
  const im = new Image();
  im.onload = () => {
    imgs[i].src = url;
    if (im.naturalWidth !== S.W || im.naturalHeight !== S.H) {
      S.W = im.naturalWidth; S.H = im.naturalHeight;
      stages.forEach((st, k) => {
        st.style.width = S.W + "px"; st.style.height = S.H + "px";
        imgs[k].style.width = S.W + "px"; imgs[k].style.height = S.H + "px";
        svgs[k].setAttribute("width", S.W);
        svgs[k].setAttribute("height", S.H);
        svgs[k].setAttribute("viewBox", `0 0 ${S.W} ${S.H}`);
      });
      S.pts = [];
      S.fitted = true;
      fit();
    }
  };
  im.src = url;
}

/* --------------------------- trasformazione --------------------------- */
function visiblePane() { return panes.find(p => !p.classList.contains("hide")); }

function applyT() {
  const t = `translate(${S.tx}px, ${S.ty}px) scale(${S.s})`;
  stages.forEach(st => st.style.transform = t);
  $("zlbl").textContent = Math.round(S.s * 100) + "%";
  drawDraft();
}

function fit() {
  const r = visiblePane().getBoundingClientRect();
  if (!S.W || !r.width || !r.height) return;
  S.fitS = Math.min(r.width / S.W, r.height / S.H);
  S.s = S.fitS;
  S.tx = (r.width - S.W * S.s) / 2;
  S.ty = (r.height - S.H * S.s) / 2;
  S.fitted = true;
  applyT();
}

function zoomAt(mx, my, f) {
  const ns = Math.min(Math.max(S.s * f, S.fitS * 0.6), 24);
  const k = ns / S.s;
  S.tx = mx - (mx - S.tx) * k;
  S.ty = my - (my - S.ty) * k;
  S.s = ns; S.fitted = false;
  applyT();
}

new ResizeObserver(() => { if (S.fitted) fit(); else applyT(); })
  .observe($("panes"));

/* ------------------------------ disegno ------------------------------ */
function drawDraft() {
  let h = "";
  const r = 5 / S.s;
  if (S.pts.length) {
    const p = S.pts.map(q => q[0] + "," + q[1]).join(" ");
    const live = (S.cursor && S.mode === "poly") ? p + " " + S.cursor.join(",") : p;
    if (S.pts.length >= 2)
      h += `<polygon points="${p}" fill="rgba(255,176,0,.20)" stroke="none"/>`;
    h += `<polyline points="${live}" fill="none" stroke="#ffb000" stroke-width="2"
           stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
    S.pts.forEach((q, i) => {
      h += `<circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="${i ? "#ffb000" : "#fff"}"
             stroke="#000" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    });
  }
  if (S.flash) {
    h += `<circle cx="${S.flash[0]}" cy="${S.flash[1]}" r="${12 / S.s}" fill="none"
           stroke="#00e5ff" stroke-width="3" vector-effect="non-scaling-stroke"/>`;
  }
  svgs.forEach(s => s.innerHTML = h);
}

/* ------------------------------- UI ------------------------------- */
const HINTS = {
  pan:    "<b>Naviga</b> &middot; trascina per spostare, rotellina per zoom.",
  remove: "<b>Rimuovi chiazza</b> &middot; clicca su una zona rossa per escluderla dal calcolo.",
  poly:   () => S.pts.length
    ? `<b>Aggiungi zona</b> &middot; ${S.pts.length} vertici &middot; clic sinistro: nuovo vertice &middot; ` +
      `<b>clic destro</b> (o Invio): chiudi e aggiungi &middot; Esc: annulla`
    : "<b>Aggiungi zona</b> &middot; clicca per segnare i vertici del contorno; " +
      "<b>clic destro</b> per chiudere il poligono.",
};

function updateUI() {
  document.querySelectorAll("#modes button").forEach(b =>
    b.classList.toggle("on", b.dataset.mode === S.mode));
  document.querySelectorAll("#views button").forEach(b =>
    b.classList.toggle("on", b.dataset.view === S.view));
  panes.forEach(p => { p.classList.remove("pan", "remove", "poly"); p.classList.add(S.mode); });
  $("drawgrp").hidden = !(S.mode === "poly" && S.pts.length);
  const hint = HINTS[S.mode];
  $("hint").innerHTML = typeof hint === "function" ? hint() : hint;
  drawDraft();
}

function setView(v) {
  S.view = v;
  panes[0].classList.toggle("hide", v === "ov");
  panes[1].classList.toggle("hide", v === "orig");
  updateUI();
  requestAnimationFrame(() => { if (S.fitted) fit(); else applyT(); });
}

function setMode(m) {
  if (m !== "poly") S.pts = [];
  S.mode = m; S.cursor = null;
  updateUI();
}

document.querySelectorAll("#modes button").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));
document.querySelectorAll("#views button").forEach(b =>
  b.addEventListener("click", () => setView(b.dataset.view)));
$("zfit").addEventListener("click", fit);
$("zin").addEventListener("click", () => {
  const r = visiblePane().getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 1.4);
});
$("zout").addEventListener("click", () => {
  const r = visiblePane().getBoundingClientRect();
  zoomAt(r.width / 2, r.height / 2, 1 / 1.4);
});

/* ------------------------ azioni verso Python ------------------------ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function closePoly() {
  if (S.pts.length < 3) {
    $("hint").innerHTML = "<b>Servono almeno 3 vertici</b> per chiudere una zona.";
    return;
  }
  ST.value({
    id: uid(), type: "poly",
    pts: S.pts.map(q => [q[0] / S.W, q[1] / S.H]),
  });
  S.pts = []; S.cursor = null;
  updateUI();
}
function undoPoint() { S.pts.pop(); updateUI(); }
function cancelPoly() { S.pts = []; S.cursor = null; updateUI(); }
$("bClose").addEventListener("click", closePoly);
$("bUndoPt").addEventListener("click", undoPoint);
$("bCancel").addEventListener("click", cancelPoly);

window.addEventListener("keydown", e => {
  if (S.mode !== "poly") return;
  if (e.key === "Escape") cancelPoly();
  else if (e.key === "Enter") closePoly();
  else if (e.key === "Backspace" || e.key === "Delete" ||
           ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z")) {
    e.preventDefault(); undoPoint();
  }
});

/* ---------------------------- puntatore ---------------------------- */
function toImage(pane, e) {
  const r = pane.getBoundingClientRect();
  return [(e.clientX - r.left - S.tx) / S.s, (e.clientY - r.top - S.ty) / S.s];
}
const inside = p => p[0] >= 0 && p[1] >= 0 && p[0] <= S.W && p[1] <= S.H;

let drag = null;
panes.forEach(pane => {
  pane.addEventListener("pointerdown", e => {
    if (e.button !== 0 && e.button !== 1) return;
    drag = {x: e.clientX, y: e.clientY, tx: S.tx, ty: S.ty,
            moved: false, btn: e.button};
    pane.setPointerCapture(e.pointerId);
    window.focus();
  });

  pane.addEventListener("pointermove", e => {
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 4) {
        drag.moved = true; pane.classList.add("drag");
      }
      if (drag.moved) {
        S.tx = drag.tx + dx; S.ty = drag.ty + dy; S.fitted = false;
        applyT();
      }
    } else if (S.mode === "poly" && S.pts.length) {
      S.cursor = toImage(pane, e);
      drawDraft();
    }
  });

  pane.addEventListener("pointerup", e => {
    const d = drag; drag = null;
    pane.classList.remove("drag");
    if (!d || d.moved || d.btn !== 0) return;
    const p = toImage(pane, e);
    if (!inside(p)) return;
    if (S.mode === "remove") {
      S.flash = p; drawDraft();
      setTimeout(() => { S.flash = null; drawDraft(); }, 700);
      ST.value({id: uid(), type: "remove", fx: p[0] / S.W, fy: p[1] / S.H});
    } else if (S.mode === "poly") {
      S.pts.push([Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]);
      updateUI();
    }
  });

  pane.addEventListener("pointerleave", () => {
    if (!drag && S.cursor) { S.cursor = null; drawDraft(); }
  });

  pane.addEventListener("contextmenu", e => {
    if (S.mode !== "poly") return;
    e.preventDefault();
    closePoly();
  });

  pane.addEventListener("wheel", e => {
    e.preventDefault();
    const r = pane.getBoundingClientRect();
    zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, {passive: false});
});

updateUI();
ST.ready();
</script>
</body>
</html>
